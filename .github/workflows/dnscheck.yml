name: DNS check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get -qq install -y dnsutils whois >/dev/null 2>&1 || true
          {
          for s in 8.8.8.8 1.1.1.1; do echo "== @$s"; for t in NS A MX TXT; do echo "-- $t"; dig +noall +answer +comments $t kursdela.media @$s | grep -E "status|IN"; done; done
          echo "== trace NS from TLD"; dig +noall +authority +comments NS kursdela.media @$(dig +short NS media. | head -1) | head -20
          echo "== cloudflare ns direct"; dig +noall +answer MX kursdela.media @cullen.ns.cloudflare.com
          echo "== DS"; dig +short DS kursdela.media @8.8.8.8
          echo "== whois"; whois kursdela.media | grep -iE "status|expir|name server|registrar" | head -20
          } > dns.txt 2>&1
          cat dns.txt
      - uses: actions/checkout@v4
        with: { ref: main, path: repo }
      - run: |
          cd repo && git checkout -B dnscheck && cp ../dns.txt . && git add dns.txt
          git -c user.name=bot -c user.email=bot@local commit -qm dns && git push -qf origin dnscheck
