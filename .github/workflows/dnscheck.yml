name: DNS check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get -qq install -y dnsutils whois >/dev/null 2>&1 || true
          {
          for d in kursdela.ru kursdela.press kursdela.news kursdelamedia.ru kurs-dela.ru kursdela.pro kursdela.info kurs-dela.media kursdela.online; do
            ns=$(dig +short NS $d @8.8.8.8 | head -1); st=$(dig +noall +comments SOA $d @8.8.8.8 | grep -o "status: [A-Z]*")
            echo "$d | $st | ns=$ns"
          done
          } > dns.txt 2>&1
          cat dns.txt
      - uses: actions/checkout@v4
        with: { ref: main, path: repo }
      - run: |
          cd repo && git checkout -B dnscheck && cp ../dns.txt . && git add dns.txt
          git -c user.name=bot -c user.email=bot@local commit -qm dns && git push -qf origin dnscheck
