name: Fetch fonts
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/f && cd /tmp/f
          for p in @fontsource-variable/noto-serif-display @fontsource-variable/noto-serif @fontsource-variable/golos-text; do npm pack "$p" --silent; done
          for t in *.tgz; do mkdir -p "x_$t"; tar -xzf "$t" -C "x_$t"; done
          mkdir -p $GITHUB_WORKSPACE/static/fonts
          find . -name "*.woff2" | grep -E "(cyrillic|latin)-(full|wght|wdth)?-?normal|cyrillic-.*normal|latin-.*normal" | grep -v ext > list.txt || true
          find . -name "*.woff2" | sed 's#.*/##' | sort > $GITHUB_WORKSPACE/static/fonts/_all.txt
          for f in $(find . -name "*.woff2" | grep -E "/(noto-serif-display-(cyrillic|latin)-standard-(normal|italic)|noto-serif-(cyrillic|latin)-wght-(normal|italic)|golos-text-(cyrillic|latin)-wght-normal)\.woff2$"); do cp "$f" $GITHUB_WORKSPACE/static/fonts/; done
          ls -la $GITHUB_WORKSPACE/static/fonts
      - run: |
          git checkout -B fonts && git add static/fonts
          git -c user.name=bot -c user.email=bot@local commit -qm fonts && git push -qf origin fonts
