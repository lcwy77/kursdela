name: Отложенная публикация
# Материал с датой в будущем сборка пропускает. Раз в час этот воркфлоу пересобирает сайт
# и выкладывает его, только если появилась новая страница: то есть настало время отложенного материала.
on:
  schedule:
    - cron: "4 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка
        run: python3 build.py
      - name: Выкладка, если вышел отложенный материал
        run: |
          new=$(git status --porcelain --untracked-files=all docs | grep '^?? docs/.*\.html$' || true)
          if [ -z "$new" ]; then echo "Новых страниц нет"; exit 0; fi
          echo "$new"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git commit -m "Отложенная публикация: $(echo "$new" | sed 's#.*/##; s#\.html##' | tr '\n' ' ')"
          git push
