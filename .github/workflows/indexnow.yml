name: IndexNow
# После каждой выкладки сайта сообщает Яндексу (и Bing) о страницах из sitemap.xml
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:
jobs:
  ping:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send URLs to IndexNow
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>([^<]+)</loc>", open("docs/sitemap.xml", encoding="utf-8").read())
          body = json.dumps({"host": "kursdela.media", "key": "a14603104d871c14bd22b68dc57fa365",
                             "keyLocation": "https://kursdela.media/a14603104d871c14bd22b68dc57fa365.txt", "urlList": urls}).encode()
          for ep in ["https://yandex.com/indexnow", "https://api.indexnow.org/indexnow"]:
              req = urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print(ep, r.status, len(urls), "urls")
              except Exception as e:
                  print(ep, "error:", e)
          PY
